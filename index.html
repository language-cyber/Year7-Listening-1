<!DOCTYPE html>
<html lang="ms" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Mendengar IGCSE (40 Marks)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body{background:#f8fafc;font-family:sans-serif; transition: filter 0.3s ease;}
        .no-select { -webkit-user-select: none; user-select: none; }
        @media print { html, body { display: none !important; } }
        .blurred-security { filter: blur(25px) grayscale(100%) !important; pointer-events: none !important; opacity: 0.2 !important; }
        .opt-btn{width:100%;text-align:left;padding:1rem;border:2px solid #e2e8f0;border-radius:1rem;margin-bottom:0.75rem;transition:all 0.2s;font-weight:600;display:flex;align-items:center;background:white;cursor:pointer;}
        .opt-btn:hover{border-color:#cbd5e1;background:#f1f5f9;}
        .correct-answer{background-color:#10b981!important;color:white;border-color:#059669!important;}
        .wrong-answer{background-color:#ef4444!important;color:white;border-color:#b91c1c!important;}
        .dimmed-answer{opacity:0.4; filter:grayscale(100%);}
        .selected{border-color:#3b82f6;background-color:#eff6ff;}
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .line-through-red { text-decoration: line-through; color: #9f1239; }
        #welcome-modal { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="py-10 px-4 min-h-screen pt-24 pb-10 flex flex-col items-center no-select" id="app-body">
    
    <!-- Pendaftaran Pelajar -->
    <div id="welcome-modal" class="fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl transform scale-100 transition-transform">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black text-indigo-900 uppercase italic">Pendaftaran Pelajar</h2>
                <p class="text-sm text-slate-500 font-medium mt-2">Sila lengkapkan butiran di bawah sebelum memulakan ujian.</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black uppercase text-indigo-600 mb-1">Nama Penuh</label>
                    <input type="text" id="student-name" placeholder="Contoh: Ahmad Albab" class="w-full p-4 rounded-xl border-2 border-slate-200 focus:border-indigo-500 outline-none font-bold text-slate-800 transition-colors" />
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-indigo-600 mb-1">Pilih Guru Anda</label>
                    <select id="student-teacher" class="w-full p-4 rounded-xl border-2 border-slate-200 focus:border-indigo-500 outline-none font-bold text-slate-800 transition-colors bg-white">
                        <option value="" disabled selected>Pilih Guru...</option>
                        <option value="Satina">Cikgu Satina</option>
                        <option value="Shahrizan">Cikgu Shahrizan</option>
                        <option value="Aziana">Cikgu Aziana</option>
                        <option value="Farra">Cikgu Farra</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black uppercase text-indigo-600 mb-1">Tahun (Year)</label>
                        <select id="student-year" class="w-full p-4 rounded-xl border-2 border-slate-200 focus:border-indigo-500 outline-none font-bold text-slate-800 transition-colors bg-white">
                            <option value="" disabled selected>Pilih...</option>
                            <option value="7">Year 7</option>
                            <option value="8">Year 8</option>
                            <option value="9">Year 9</option>
                            <option value="10">Year 10</option>
                            <option value="11">Year 11</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-indigo-600 mb-1">Tahap Kelas</label>
                        <select id="student-level" class="w-full p-4 rounded-xl border-2 border-slate-200 focus:border-indigo-500 outline-none font-bold text-slate-800 transition-colors bg-white">
                            <option value="" disabled selected>Pilih...</option>
                            <option value="Advanced">Advanced</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Foundation">Foundation</option>
                        </select>
                    </div>
                </div>
                <button onclick="startQuiz()" class="w-full py-4 mt-2 bg-indigo-600 text-white rounded-xl font-black uppercase tracking-widest shadow-lg hover:bg-indigo-700 hover:scale-[1.02] transition-all">Mula Ujian Sekarang</button>
            </div>
        </div>
    </div>

    <div class="fixed top-0 left-0 w-full bg-white/95 backdrop-blur-md border-b shadow-sm z-50 py-3 px-4 sm:px-6 flex justify-between items-center">
        <div>
            <h1 class="text-xs sm:text-sm font-black text-indigo-900 uppercase italic leading-none">Latihan Mendengar IGCSE (40 Marks)</h1>
            <p class="text-[8px] font-bold text-slate-400 mt-1 uppercase"><span id="display-student-name">Pelajar</span> | </p>
        </div>
        <div class="text-lg sm:text-xl font-black text-indigo-600 leading-none bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-100 flex items-center gap-2">
            <span id="offline-indicator" class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse" title="Auto-Save Aktif"></span>
            <span>Skor: <span id="score-display">-</span> / <span id="total-display">0</span></span>
        </div>
    </div>

    <div id="main-content" class="max-w-3xl mx-auto w-full mt-4 hidden">
        <div id="tabs" class="flex overflow-x-auto gap-2 mb-4 pb-2 hide-scrollbar px-1"></div>
        <div id="box" class="bg-white p-6 sm:p-8 rounded-[2.5rem] shadow-xl border border-slate-100 mb-8"></div>
    </div>

    <!-- LOADING OVERLAY MASA HANTAR -->
    <div id="submitting-overlay" class="fixed inset-0 z-[200] bg-white/80 backdrop-blur-sm flex-col items-center justify-center hidden">
        <div class="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
        <h3 class="text-lg font-black text-indigo-900 uppercase">Menghantar Jawapan...</h3>
        <p class="text-xs font-bold text-slate-500 mt-1">Sila tunggu sebentar.</p>
    </div>

    <script>

const sections = [{"id":1,"title":"Bhg 1 (S1-8)","type":"objective","situation":"Penghuni sentiasa berasa selamat dan tenteram apabila berada di dalam rumah sendiri.","questions":[{"id":1,"text":"Apakah faktor utama yang menjadikan Encik Rahim berasa rumahnya selamat?","options":{"A":"Saiz rumah yang besar","B":"Jumlah ahli keluarga yang ramai","C":"Pengawasan rapi dan pintu berkunci","D":"Reka bentuk dalaman yang moden"},"correct":"C","evidence":"M1 (Encik Rahim): Pengawasan dan pintu yang sentiasa berkunci itu penting."},{"id":2,"text":"Menurut Puan Siti, apakah yang menyumbang kepada ketenangan di dalam rumah?","options":{"A":"Hiasan rumah yang mahal","B":"Ketiadaan masalah kewangan","C":"Suasana harmoni dan aktiviti keluarga","D":"Kawasan kejiranan yang sibuk"},"correct":"C","evidence":"F1 (Puan Siti): Dan ketenangan itu pula datang daripada suasana harmoni serta aktiviti bersama dalam keluarga kita."},{"id":3,"text":"Apakah yang membolehkan penghuni rumah berasa selesa untuk berehat?","options":{"A":"Mempunyai banyak bilik","B":"Ketiadaan bunyi aneh atau gangguan luar","C":"Memasang televisyen sepanjang masa","D":"Perabot yang empuk dan mewah"},"correct":"B","evidence":"M1 (Encik Rahim): Jadi, apabila tiada bunyi-bunyi aneh atau gangguan luar, kita memang rasa sangat selesa untuk berehat."},{"id":4,"text":"Selain berwaspada, apakah satu cara tambahan untuk memastikan perlindungan menyeluruh di rumah?","options":{"A":"Membela banyak haiwan peliharaan","B":"Memasang sistem keselamatan seperti CCTV","C":"Sentiasa membuka tingkap pada waktu malam","D":"Menjemput tetamu setiap hari"},"correct":"B","evidence":"F1 (Puan Siti): Kita juga perlu sentiasa berwaspada dan menggunakan sistem keselamatan seperti kamera litar tertutup (CCTV) untuk memastikan perlindungan menyeluruh."},{"id":5,"text":"Apakah salah satu faedah utama apabila rumah berasa tenteram?","options":{"A":"Rumah kelihatan lebih bersih","B":"Penghuni dapat fokus dan lebih ceria","C":"Bil elektrik menjadi lebih rendah","D":"Rumah sering dikunjungi rakan-rakan"},"correct":"B","evidence":"M1 (Encik Rahim): Apabila rumah ini tempat yang tenteram, saya dapat fokus pada pekerjaan dari rumah dan ahli keluarga pun ceria."},{"id":6,"text":"Mengapakah peranan jiran penting dalam mewujudkan rasa selamat di rumah?","options":{"A":"Jiran boleh meminjamkan barang","B":"Jiran sering membuat bising","C":"Jiran yang prihatin akan peka dengan keadaan sekeliling","D":"Jiran membantu kerja-kerja rumah"},"correct":"C","evidence":"F1 (Puan Siti): Ya, dan peranan jiran yang prihatin juga sangat penting. Mereka sentiasa peka dengan keadaan sekeliling."},{"id":7,"text":"Apakah tanggungjawab setiap ahli keluarga untuk keselamatan bersama?","options":{"A":"Menghabiskan masa di luar rumah","B":"Sentiasa berjaga-jaga dan bertanggungjawab","C":"Bergantung sepenuhnya kepada jiran","D":"Membiarkan pintu tidak berkunci"},"correct":"B","evidence":"M1 (Encik Rahim): Akhirnya, setiap ahli keluarga juga perlu bertanggungjawab dan sentiasa berjaga-jaga demi keselamatan bersama."},{"id":8,"text":"Apakah kesimpulan Puan Siti tentang punca keselamatan dan ketenangan?","options":{"A":"Datang dari pihak berkuasa","B":"Bermula dari rumah sendiri","C":"Bergantung kepada cuaca","D":"Diperoleh daripada bahan bacaan"},"correct":"B","evidence":"F1 (Puan Siti): Keselamatan dan ketenangan bermula dari rumah kita sendiri."}]},{"id":2,"title":"Bhg 2 (S9-14)","type":"objective","situation":"Interaksi yang baik antara jiran tetangga mewujudkan persekitaran tempat tinggal yang harmoni.","questions":[{"id":9,"text":"Apakah yang dibincangkan oleh Encik Ahmad dan Puan Salmah pada permulaan perbualan mereka?","options":{"A":"Keadaan harmoni di kawasan kejiranan.","B":"Penduduk yang suka beramah mesra.","C":"Pentingnya kesejahteraan jiran.","D":"Masalah kekurangan interaksi."},"correct":"A","evidence":"M1 (Encik Ahmad): Puan Salmah, saya perhatikan kawasan kejiranan kita ini sungguh harmoni."},{"id":10,"text":"Apakah tindakan jiran yang disebut oleh Encik Ahmad sebagai contoh interaksi yang baik?","options":{"A":"Membaiki kereta yang rosak.","B":"Menghantar Encik Ahmad ke tempat kerja.","C":"Memberikan bantuan kecil kepada jiran.","D":"Menunjukkan semangat kejiranan."},"correct":"B","evidence":"M1 (Encik Ahmad): ...jiran sebelah rumah tanpa berfikir panjang terus bantu menghantar saya ke tempat kerja."},{"id":11,"text":"Apakah perasaan yang timbul daripada adanya jiran yang boleh diharap?","options":{"A":"Rasa gembira dan seronok.","B":"Rasa dihargai dan tidak kesunyian.","C":"Rasa selamat dan selesa.","D":"Rasa sentiasa berteman."},"correct":"C","evidence":"M1 (Encik Ahmad): Rasa selamat dan selesa tinggal di sini kerana kita tahu ada jiran yang boleh diharap."},{"id":12,"text":"Apakah jenis aktiviti yang kerap diadakan di kejiranan mereka?","options":{"A":"Gotong-royong dan majlis makan-makan.","B":"Beramah mesra dengan jiran.","C":"Mengenali jiran dengan lebih dekat.","D":"Aktiviti komuniti bersama."},"correct":"A","evidence":"M1 (Encik Ahmad): Selain itu, aktiviti komuniti seperti gotong-royong atau majlis makan-makan juga kerap diadakan."},{"id":13,"text":"Apakah manfaat utama aktiviti komuniti kepada hubungan antara jiran?","options":{"A":"Mengukuhkan hubungan silaturahim.","B":"Sekadar bertanyakan khabar di pagar.","C":"Menambahkan bilangan kenalan.","D":"Memupuk sikap toleransi."},"correct":"A","evidence":"M1 (Encik Ahmad): Melalui aktiviti begitu, hubungan silaturahim jadi lebih kukuh..."},{"id":14,"text":"Apakah kesimpulan yang dibuat oleh Encik Ahmad mengenai interaksi jiran tetangga?","options":{"A":"Menjadikan kehidupan lebih bermakna.","B":"Kunci utama persekitaran harmoni.","C":"Mewujudkan hubungan yang ceria.","D":"Dapat bersetuju dengan Puan Salmah."},"correct":"B","evidence":"M1 (Encik Ahmad): Pendek kata, interaksi yang baik inilah kunci utama kepada persekitaran tempat tinggal yang benar-benar harmoni."}]},{"id":3,"title":"Bhg 3 (S15-19)","type":"objective","situation":"Cabaran dalam penyelenggaraan kediaman sering memerlukan perancangan kewangan dan kemahiran praktikal.","questions":[{"id":15,"text":"Mengapakah Pn. Lisa dan En. Faiz perlu bertindak segera terhadap masalah paip bocor?","options":{"A":"Untuk mengelakkan pembaziran air dan peningkatan bil.","B":"Untuk memastikan rumah sentiasa bersih dan kemas.","C":"Untuk menguji kemahiran membaiki paip sendiri.","D":"Untuk menggunakan simpanan kecemasan mereka."},"correct":"A","evidence":"M1 (En. Faiz): ...Bil air kita pasti melambung.\nF1 (Pn. Lisa): Ya, Faiz. Kita perlu baiki segera untuk elak pembaziran dan kerosakan lebih teruk."},{"id":16,"text":"Apakah cadangan Pn. Lisa untuk mengelakkan kerosakan yang lebih teruk pada bumbung?","options":{"A":"Membiarkan bumbung retak hingga musim hujan.","B":"Memeriksa bumbung setiap tahun terutamanya sebelum musim hujan.","C":"Hanya membaiki bumbung apabila air telah masuk ke dalam rumah.","D":"Mengecat bumbung dengan cat kalis air."},"correct":"B","evidence":"F1 (Pn. Lisa): Betul. Patutnya kita periksa bumbung setiap tahun, terutamanya sebelum musim hujan, barulah tak ada masalah nanti."},{"id":17,"text":"Apakah langkah terbaik yang akan diambil oleh Pn. Lisa dan En. Faiz untuk mengatasi masalah tikus di dapur?","options":{"A":"Meningkatkan kebersihan rumah.","B":"Meletakkan perangkap tikus sendiri.","C":"Memanggil syarikat kawalan serangga perosak.","D":"Mengabaikan masalah tersebut kerana ia akan hilang sendiri."},"correct":"C","evidence":"F1 (Pn. Lisa): Kita terpaksa panggil syarikat kawalan serangga perosak. Bersihkan rumah saja tak cukup kalau dah serius macam ni."},{"id":18,"text":"Mengapakah En. Faiz menekankan kepentingan memanggil juruelektrik bertauliah untuk masalah lampu berkelip-kelip?","options":{"A":"Kerana ia adalah masalah kecil yang boleh diselesaikan dengan cepat.","B":"Kerana juruelektrik bertauliah mempunyai alatan yang canggih.","C":"Untuk memastikan keselamatan kerana masalah elektrik boleh menyebabkan kebakaran.","D":"Untuk mengelakkan pembaziran elektrik."},"correct":"C","evidence":"M1 (En. Faiz): ...Jangan cuba baiki sendiri, bahaya.\nF1 (Pn. Lisa): ...Keselamatan keluarga lebih penting, Faiz."},{"id":19,"text":"Apakah pendekatan yang dipertimbangkan oleh Pn. Lisa dan En. Faiz untuk mengecat semula rumah mereka?","options":{"A":"Mengecat keseluruhan rumah sendiri untuk menjimatkan kos.","B":"Mengupah profesional untuk mengecat semua bahagian rumah.","C":"Mengecat bahagian dalam rumah sendiri dan mengupah profesional untuk bahagian luar.","D":"Menangguhkan kerja mengecat kerana kekangan kos."},"correct":"C","evidence":"F1 (Pn. Lisa): Kalau kita cat sendiri bahagian dalam, boleh jimat. Tapi untuk luar, lebih baik upah profesional sebab rumit."}]},{"id":4,"title":"Bhg 4 (S20-28)","type":"objective","situation":"Proses penyesuaian kepada rumah baharu seringkali melibatkan perubahan gaya hidup dan rutin harian.","questions":[{"id":20,"text":"Apakah cabaran utama yang dihadapi Maria pada peringkat awal penyesuaian ke rumah baharu?","options":{"A":"Kesukaran mencari kedai runcit.","B":"Rasa kekok dan rutin harian yang berubah.","C":"Tidak dapat mengenali jiran tetangga.","D":"Rumah baharu yang terlalu besar untuk diuruskan."},"correct":"B","evidence":"F1 (Maria): Azmi, pada mulanya memang agak mencabar. Rutin harian saya berubah sepenuhnya, dan saya rasa sedikit kekok dengan persekitaran yang asing ini. Perubahan gaya hidup dan cara menguruskan rumah baharu memerlukan masa."},{"id":21,"text":"Apakah salah satu langkah awal yang diambil Maria untuk mengenali persekitaran rumah baharunya?","options":{"A":"Mempelajari laluan pintas ke bandar.","B":"Mencari tempat makan menarik yang dicadangkan.","C":"Meneroka kawasan sekitar seperti kedai dan taman.","D":"Memaksa diri untuk berubah secara drastik."},"correct":"C","evidence":"F1 (Maria): Saya mula dengan meneroka persekitaran sekitar rumah, seperti mencari kedai runcit dan taman rekreasi."},{"id":22,"text":"Mengapakah Maria merasakan usaha mengenali jiran tetangga sangat membantu dalam proses penyesuaian?","options":{"A":"Jiran dapat membantu dalam kerja-kerja penyelenggaraan rumah.","B":"Jiran memberikan rasa selamat dan diterima dalam komuniti.","C":"Jiran sering menganjurkan majlis keraian.","D":"Jiran berkongsi petua masakan sihat."},"correct":"B","evidence":"F1 (Maria): Ya, amat membantu! Mengenali jiran membuat saya rasa lebih selamat dan diterima. Saya juga belajar banyak perkara baharu, seperti laluan pintas ke bandar dan tempat makan menarik yang mereka cadangkan. Ini meningkatkan rasa kepunyaan saya kepada komuniti setempat."},{"id":23,"text":"Apakah kesan positif terhadap diri Maria hasil daripada penyesuaian di rumah baharu?","options":{"A":"Maria menjadi lebih pasif dan bergantung.","B":"Maria mula kurang memasak di rumah.","C":"Maria menjadi lebih berdikari dan bertanggungjawab.","D":"Maria mendapati kerja penyelenggaraan rumah semakin sukar."},"correct":"C","evidence":"F1 (Maria): Dengan rumah yang lebih besar, saya terpaksa belajar menguruskan ruang dengan lebih cekap. Ini secara tidak langsung menjadikan saya lebih berdikari dan bertanggungjawab."},{"id":24,"text":"Selain lebih berdikari, apakah kemahiran baharu yang Maria pelajari hasil penyesuaian ini?","options":{"A":"Mahir dalam kerja-kerja penyelenggaraan kecil di rumah.","B":"Mahir dalam pertukangan perabot.","C":"Mahir mengendalikan peralatan elektronik kompleks.","D":"Mahir dalam berkebun secara profesional."},"correct":"A","evidence":"F1 (Maria): Ini secara tidak langsung menjadikan saya lebih berdikari dan bertanggungjawab. Contohnya, saya kini lebih mahir dalam kerja-kerja penyelenggaraan kecil di rumah."},{"id":25,"text":"Apakah cabaran emosi yang kadang kala masih dihadapi oleh Maria?","options":{"A":"Rasa bosan dengan persekitaran baharu.","B":"Kerinduan pada suasana rumah dan rakan lama.","C":"Tekanan untuk bertemu jiran baharu.","D":"Kesukaran mencari aktiviti riadah yang sesuai."},"correct":"B","evidence":"F1 (Maria): Sejujurnya, ada masanya saya masih merindui suasana rumah lama dan kenangan di sana, terutamanya rakan-rakan lama."},{"id":26,"text":"Mengikut Maria, apakah sifat penting yang diperlukan untuk berjaya dalam proses penyesuaian?","options":{"A":"Kelajuan dalam membuat keputusan.","B":"Sikap menunggu dan memerhati.","C":"Kesabaran dan keinginan menerima perubahan.","D":"Kebolehan untuk mengelakkan interaksi sosial."},"correct":"C","evidence":"F1 (Maria): Setiap hari ada perkara baharu yang saya pelajari tentang rumah dan komuniti ini. Ia memerlukan kesabaran dan keinginan untuk menerima perubahan."},{"id":27,"text":"Apakah nasihat utama Maria kepada individu yang baru berpindah ke rumah baharu?","options":{"A":"Segera ubah semua rutin harian.","B":"Elakkan berinteraksi dengan komuniti setempat.","C":"Berikan masa kepada diri sendiri dan nikmati prosesnya.","D":"Fokus hanya pada aspek kewangan dan penjimatan."},"correct":"C","evidence":"F1 (Maria): Nasihat saya, berikan masa kepada diri sendiri. Jangan terburu-buru untuk berubah. Luangkan masa untuk meneroka, berinteraksi dengan komuniti, dan paling penting, nikmati setiap langkah dalam perjalanan penyesuaian ini. Ia pengalaman yang berharga."},{"id":28,"text":"Berdasarkan perbualan tadi, apakah kesimpulan menyeluruh tentang proses penyesuaian kepada rumah baharu?","options":{"A":"Proses penyesuaian adalah mudah dan tidak memerlukan banyak usaha.","B":"Penyesuaian hanyalah tentang mengubah rutin harian tanpa melibatkan emosi.","C":"Ia merupakan proses berterusan yang memerlukan masa, usaha dan kesediaan untuk menerima perubahan.","D":"Seseorang tidak akan pernah dapat menyesuaikan diri sepenuhnya dengan persekitaran baharu."},"correct":"C","evidence":"F1 (Maria): Nasihat saya, berikan masa kepada diri sendiri. Jangan terburu-buru untuk berubah. Luangkan masa untuk meneroka, berinteraksi dengan komuniti, dan paling penting, nikmati setiap langkah dalam perjalanan penyesuaian ini. Ia pengalaman yang berharga. ... Saya percaya penyesuaian adalah proses berterusan. Setiap hari ada perkara baharu yang saya pelajari tentang rumah dan komuniti ini. Ia memerlukan kesabaran dan keinginan untuk menerima perubahan."}]},{"id":5,"title":"Bhg 5 (S29-34)","type":"objective","situation":"Reka bentuk seni bina sesebuah kediaman mempengaruhi tahap fungsi dan keselesaan penghuninya.","questions":[{"id":29,"text":"Apakah pandangan Siti mengenai reka bentuk kediaman?","options":{"A":"Reka bentuk kediaman hanya penting untuk estetikanya.","B":"Reka bentuk yang baik menjadikan rumah cantik dan praktikal.","C":"Reka bentuk tidak banyak mempengaruhi fungsi rumah.","D":"Reka bentuk utama hanya untuk keselesaan penghuni."},"correct":"B","evidence":"F1 (Siti): 'Amin, saya sangat bersetuju bahawa reka bentuk memang memainkan peranan kritikal. Sebuah rumah yang direka dengan baik bukan sahaja cantik, malah sangat praktikal.'"},{"id":30,"text":"Bagaimanakah susun atur ruang yang bijak memberi impak kepada fungsi kediaman?","options":{"A":"Mengurangkan pencahayaan semula jadi.","B":"Meningkatkan aliran pergerakan dan penggunaan ruang.","C":"Menjadikan rumah lebih sempit dan sesak.","D":"Menyebabkan rumah sukar diubah suai."},"correct":"B","evidence":"F1 (Siti): '...susun atur ruang yang bijak boleh meningkatkan aliran pergerakan dan memaksimumkan penggunaan setiap sudut rumah.'"},{"id":31,"text":"Apakah dua aspek penting yang disebut oleh Amin untuk meningkatkan keselesaan sesebuah kediaman?","options":{"A":"Susun atur ruang dan pemilihan bahan binaan.","B":"Pencahayaan semula jadi dan pengudaraan yang efektif.","C":"Fleksibiliti reka bentuk dan penebat bunyi.","D":"Siling tinggi dan ruang tamu yang luas."},"correct":"B","evidence":"M1 (Amin): '...Saya juga berpendapat elemen seperti pencahayaan semula jadi dan pengudaraan yang efektif sangat penting. Rumah yang mempunyai tingkap besar atau rekaan siling tinggi selalunya lebih cerah dan sejuk, sekali gus menyumbang kepada keselesaan hidup.'"},{"id":32,"text":"Mengapakah pemilihan bahan binaan yang tepat penting dalam reka bentuk kediaman?","options":{"A":"Untuk menjadikan rumah kelihatan lebih moden.","B":"Untuk memastikan rumah tahan banjir.","C":"Untuk meningkatkan keselesaan dengan menyerap haba atau menebat bunyi.","D":"Untuk memudahkan proses pengubahsuaian di masa hadapan."},"correct":"C","evidence":"F1 (Siti): 'Penggunaan bahan yang mampu menyerap haba atau penebat bunyi yang baik pasti akan menjadikan kediaman lebih selesa dan tenang, jauh dari gangguan luar.'"},{"id":33,"text":"Apakah kepentingan fleksibiliti reka bentuk kediaman menurut Amin?","options":{"A":"Memastikan rumah sentiasa mengikut fesyen terkini.","B":"Mengurangkan kos pembinaan awal.","C":"Membolehkan kediaman diubah suai mengikut keperluan masa depan.","D":"Menjadikan rumah lebih besar daripada saiz asal."},"correct":"C","evidence":"M1 (Amin): '...Kediaman yang boleh diubah suai mengikut keperluan semasa atau masa depan keluarga akan kekal berfungsi untuk jangka masa panjang.'"},{"id":34,"text":"Apakah kesimpulan utama perbualan mereka tentang reka bentuk seni bina?","options":{"A":"Estetika adalah aspek terpenting dalam reka bentuk rumah.","B":"Reka bentuk hanyalah satu pelaburan yang bijak.","C":"Reka bentuk perlu menitikberatkan kelestarian semata-mata.","D":"Reka bentuk adalah asas kepada kehidupan yang berfungsi dan selesa."},"correct":"D","evidence":"F1 (Siti): 'Kesimpulannya, reka bentuk seni bina bukan sekadar estetik, tetapi asas kepada kehidupan yang berfungsi dan selesa dalam jangka masa panjang.'"}]},{"id":6,"title":"Bhg 6 (S35-37)","type":"objective","situation":"Setiap ruang di dalam rumah menyimpan pelbagai kenangan manis dan pahit yang membentuk identiti penghuninya.","questions":[{"id":35,"text":"Apakah fungsi utama ruang tamu dan dapur seperti yang diceritakan?","options":{"A":"Tempat berhimpun dan menjamu selera.","B":"Pusat aktiviti memasak dan melahirkan kasih sayang.","C":"Tempat berehat dan menenangkan fikiran.","D":"Ruang menyambut tetamu dan mengeratkan silaturahim.","E":"Lokasi hiburan dan rekreasi keluarga."},"correct":["B","D"],"evidence":"M1 (Ahmad): Saya sering terkenang ruang tamu rumah lama kita, Maria. Di situlah kita berkumpul, menyambut tetamu dan mengeratkan silaturahim keluarga. F1 (Maria): Ya, dan dapur pula! Ibu selalu mengajar kita memasak, di situlah terjalin kasih sayang. Itulah tempat pelbagai resipi dan cerita manis tercipta."},{"id":36,"text":"Bagaimanakah rumah tersebut telah membentuk peribadi dan nilai-nilai penghuninya?","options":{"A":"Menyediakan hiburan yang berterusan.","B":"Membentuk disiplin melalui tugasan harian yang ketat.","C":"Memupuk rasa hormat dan penyatuan dalam keluarga.","D":"Melatih kemahiran memasak secara profesional.","E":"Mengajar tentang kepentingan kemandirian diri."},"correct":["C","E"],"evidence":"M1 (Ahmad): Bilik tidur kita juga penting. Ia bukan sekadar tempat berehat, tetapi ruang peribadi yang membentuk kemandirian dan tempat kita merenung masa depan. F1 (Maria): Setiap sudut rumah itu, Ahmad, mengajar kita nilai-nilai. Ruang makan pula menjadi saksi perbincangan penting dan penyatuan keluarga. Kita belajar menghormati pendapat."},{"id":37,"text":"Apakah kesan perubahan dan evolusi di dalam rumah terhadap penghuninya?","options":{"A":"Menyebabkan kekeliruan dalam identiti diri.","B":"Menghilangkan segala kenangan manis yang lalu.","C":"Mengembalikan pelbagai memori indah yang tersimpan.","D":"Meningkatkan semangat untuk menelaah pelajaran.","E":"Menjadikan ruang hidup sempit dan tidak selesa."},"correct":["C","D"],"evidence":"M1 (Ahmad): Malah, perubahan kecil pada hiasan rumah pun kadang-kadang mengembalikan memori. Misalnya, sudut bacaan yang baru, membuatkan kita lebih rajin menelaah. F1 (Maria): Betul. Rumah itu sentiasa berevolusi bersama kita. Kenangan dan identiti kita terbentuk melalui setiap pengalaman di dalamnya."}]}];
const reqPassword = "21";
const gasAppUrl = "https://script.google.com/macros/s/AKfycbztb-uoLIo-DnUlVJxNDEZrlBqdr9T4YrhK4W3muNwgTtASHMHo2D6EZ8QhCj2oPPfH/exec";
const topicName = "RUMAH DAN KEHIDUPAN TEMPAT TINGGAL";
const moduleTitle = "Latihan Mendengar IGCSE (40 Marks)";
const storageKey = "neil_quiz_" + btoa(encodeURIComponent(moduleTitle).replace(/%/g, "")).substring(0, 15);

let cur = 0; 
let ans = JSON.parse(localStorage.getItem(storageKey + "_ans") || "{}"); 
let submitted = localStorage.getItem(storageKey + "_sub") === "true"; 
let totalMarks = 0; let requiredAnswers = 0;

let studentName = localStorage.getItem(storageKey + "_name") || "";
let studentYear = localStorage.getItem(storageKey + "_year") || "";
let studentLevel = localStorage.getItem(storageKey + "_level") || "";
let studentTeacher = localStorage.getItem(storageKey + "_teacher") || "";

sections.forEach(function(s) {
    let isM = s.id === 6 && s.type === "objective";
    (s.questions || []).forEach(function(q) { 
        totalMarks += isM ? 2 : 1; 
        requiredAnswers += isM ? 2 : 1; 
    });
});
document.getElementById("total-display").innerText = totalMarks;

document.addEventListener("contextmenu", function(e) { e.preventDefault(); }); 
document.addEventListener("visibilitychange", function() { 
    if (!submitted && document.getElementById("welcome-modal").classList.contains("hidden")) {
        if (document.hidden) { document.getElementById("app-body").classList.add("blurred-security"); } 
        else { document.getElementById("app-body").classList.remove("blurred-security"); }
    }
});
document.addEventListener("keydown", function(e) { 
    if ((e.ctrlKey || e.metaKey) && (e.key === "p" || e.key === "s")) { 
        e.preventDefault(); alert("Fungsi ini disekat."); 
    } 
});

window.checkRegistration = function() {
    if (studentName && studentYear && studentLevel && studentTeacher) {
        document.getElementById("welcome-modal").classList.add("hidden");
        document.getElementById("main-content").classList.remove("hidden");
        document.getElementById("display-student-name").innerText = studentName + " (Cikgu " + studentTeacher + " | Year " + studentYear + " - " + studentLevel + ")";
        if(submitted) calculateScore();
        renderTabs(); renderContent(); 
    } else {
        document.getElementById("welcome-modal").classList.remove("hidden");
        document.getElementById("main-content").classList.add("hidden");
    }
};

window.startQuiz = function() {
    const n = document.getElementById("student-name").value.trim();
    const y = document.getElementById("student-year").value;
    const l = document.getElementById("student-level").value;
    const t = document.getElementById("student-teacher").value;
    
    if(n.length < 3) return alert("Sila masukkan nama penuh anda (minimum 3 huruf).");
    if(!t) return alert("Sila pilih Guru anda.");
    if(!y) return alert("Sila pilih Tahun (Year) anda.");
    if(!l) return alert("Sila pilih Tahap Kelas anda.");
    
    studentName = n; studentYear = y; studentLevel = l; studentTeacher = t;
    localStorage.setItem(storageKey + "_name", studentName);
    localStorage.setItem(storageKey + "_year", studentYear);
    localStorage.setItem(storageKey + "_level", studentLevel);
    localStorage.setItem(storageKey + "_teacher", studentTeacher);
    
    checkRegistration();
};

function persistData() {
    try {
        localStorage.setItem(storageKey + "_ans", JSON.stringify(ans));
        localStorage.setItem(storageKey + "_sub", submitted ? "true" : "false");
    } catch(e) {}
}

function calculateScore() {
    let score = 0;
    sections.forEach(function(s) {
        let isM = s.id === 6 && s.type === "objective";
        (s.questions || []).forEach(function(q) {
            if (s.type === "objective" || s.type === "picture") {
                if (isM) { 
                    let uAns = ans[q.id] || []; 
                    (q.correct || []).forEach(function(c) { if(uAns.includes(c)) score++; }); 
                } 
                else { if(ans[q.id] === q.correct) score++; }
            } else if (s.type === "cloze") {
                let uAns = (ans[q.id] || "").toLowerCase().trim(); 
                let cAns = (q.correct || "").toLowerCase().trim();
                if(uAns !== "" && uAns === cAns) score++;
            }
        });
    });
    document.getElementById("score-display").innerText = score;
    return score;
}

function renderTabs() {
    let html = "";
    sections.forEach(function(s, idx) {
        let activeClass = cur === idx ? "bg-indigo-600 text-white shadow-md scale-[1.02]" : "bg-white border border-slate-200 text-slate-500 hover:bg-slate-50";
        let ansCount = 0;
        let targetCount = s.id === 6 && s.type === "objective" ? (s.questions ? s.questions.length * 2 : 0) : (s.questions ? s.questions.length : 0);
        
        if(s.questions) { 
            s.questions.forEach(function(q) { 
                if(ans[q.id]) { 
                    if(Array.isArray(ans[q.id])) ansCount += ans[q.id].length; 
                    else if(ans[q.id].trim() !== "") ansCount++; 
                } 
            }); 
        }
        let statusDot = (!submitted && ansCount > 0 && ansCount >= targetCount) ? "<span class='inline-block w-2 h-2 rounded-full bg-emerald-400 ml-2'></span>" : "";
        html += "<button onclick='changeTab(" + idx + ")' class='px-5 py-3 rounded-2xl text-[10px] sm:text-xs font-black uppercase whitespace-nowrap transition-all " + activeClass + "'>" + s.title + statusDot + "</button>";
    });
    document.getElementById("tabs").innerHTML = html;
}

window.changeTab = function(idx) { cur = idx; renderTabs(); renderContent(); window.scrollTo({ top: 0, behavior: "smooth" }); };

window.saveOpt = function(id, v, isM) {
    if(submitted) return;
    if(isM) { 
        if(!ans[id]) ans[id] = []; 
        let idx = ans[id].indexOf(v); 
        if(idx > -1) ans[id].splice(idx, 1); 
        else if(ans[id].length < 2) ans[id].push(v); 
    } 
    else { ans[id] = v; }
    persistData(); renderTabs(); renderContent();
};

window.saveText = function(id, val) {
    if(submitted) return;
    ans[id] = val; persistData(); renderTabs();
};

window.submitQuiz = function() {
    let currentAnsCount = 0;
    Object.values(ans).forEach(function(v) { 
        if(Array.isArray(v)) currentAnsCount += v.length; 
        else if(v.trim() !== "") currentAnsCount++; 
    });
    if(currentAnsCount < requiredAnswers) { 
        if(!confirm("Awak belum menanda semua soalan. Teruskan hantar?")) return; 
    }

    if (reqPassword !== "") {
        let userPwd = prompt("🛑 KATA LALUAN DIPERLUKAN\n\nSila masukkan kata laluan dari guru:");
        if (userPwd === null) return; 
        if (userPwd.trim() !== reqPassword) { alert("❌ Kata laluan salah!"); return; }
    }
    
    const finalScore = calculateScore();
    if (gasAppUrl && gasAppUrl.startsWith("http")) {
        document.getElementById("submitting-overlay").classList.remove("hidden");
        document.getElementById("submitting-overlay").classList.add("flex");
        
        const payload = {
            topic: topicName,
            name: studentName,
            year: studentYear,
            level: studentLevel,
            teacher: studentTeacher,
            score: finalScore,
            total: totalMarks,
            details: ans
        };

        // --- FIXED CONTENT TYPE FOR GAS ---
        fetch(gasAppUrl, { 
            method: "POST", 
            mode: "no-cors", 
            headers: { "Content-Type": "text/plain;charset=utf-8" }, 
            body: JSON.stringify(payload) 
        })
        .then(function() { finalizeSubmission(); })
        .catch(function(err) { alert("Ralat hantar ke database cikgu, tapi jawapan telah disimpan di peranti ini."); finalizeSubmission(); });
    } else { finalizeSubmission(); }
};

function finalizeSubmission() {
    document.getElementById("submitting-overlay").classList.add("hidden");
    document.getElementById("submitting-overlay").classList.remove("flex");
    submitted = true; persistData(); calculateScore();
    document.getElementById("app-body").classList.remove("blurred-security");
    renderTabs(); renderContent(); window.scrollTo({ top: 0, behavior: "smooth" });
}

window.resetData = function() {
    if(confirm("AWAS: Jawapan anda akan dipadam! Teruskan?")) {
        localStorage.removeItem(storageKey + "_ans"); localStorage.removeItem(storageKey + "_sub");
        localStorage.removeItem(storageKey + "_name"); localStorage.removeItem(storageKey + "_year");
        localStorage.removeItem(storageKey + "_level"); localStorage.removeItem(storageKey + "_teacher");
        location.reload();
    }
};

function escapeHTML(str) {
    if (!str) return "";
    return String(str).replace(/[&<>'"]/g, function(tag) {
        return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        }[tag] || tag;
    });
}

                    }

                if(submitted && q.evidence) h += "<div class='mt-4 p-4 bg-amber-50 rounded-2xl text-xs font-bold text-amber-800 border border-amber-200'>💡 Bukti: " + escapeHTML(q.evidence) + "</div>";

                let uAns = ans[q.id] || ""; let isCorrect = false;
                if (submitted) isCorrect = (uAns.toLowerCase().trim() === (q.correct || "").toLowerCase().trim());
                let inputClass = "w-full p-3 rounded-xl border-2 font-bold outline-none transition-all ";
                if (submitted) { if (isCorrect) inputClass += "border-emerald-500 bg-emerald-50 text-emerald-700"; else inputClass += "border-rose-500 bg-rose-50 text-rose-700 line-through-red"; }

                let safeAns = escapeHTML(uAns).replace(/'/g, "&#39;");

                if(submitted) { if (isCorrect) h += "<div class='mt-2 text-xs font-black text-emerald-600 flex items-center gap-1'>✅ Tepat!</div>"; else h += "<div class='mt-2 p-3 bg-rose-100 text-rose-800 rounded-xl border border-rose-200 text-xs font-bold'>❌ Salah. Jawapan sebenar: <span class='text-rose-900 font-black'>" + escapeHTML(q.correct) + "</span></div>"; }
            } 
            else {

                Object.keys(q.options || {}).sort().forEach(function(k) {

                        if(submitted) { if(isActuallyCorrect) cl += " correct-answer"; else if (isSelected && !isActuallyCorrect) cl += " wrong-answer"; else cl += " dimmed-answer"; }

        });
    } else { h += "<div class='text-center py-10 text-slate-400 font-bold uppercase text-xs'>Tiada soalan.</div>"; }
    
    if(!submitted && cur === sections.length - 1) { h += "<button onclick='submitQuiz()' class='w-full bg-emerald-500 text-white py-5 rounded-[1.5rem] font-black text-lg uppercase shadow-xl transition-all hover:bg-emerald-600 hover:scale-[1.02] mt-6 border-b-4 border-emerald-700'>HANTAR JAWAPAN</button>"; } 
    else if (!submitted && cur < sections.length - 1) { h += "<button onclick='changeTab(" + (cur + 1) + ")' class='w-full bg-blue-500 text-white py-4 rounded-2xl font-black uppercase shadow-lg transition-all hover:bg-blue-600 mt-4 border-b-4 border-blue-700'>Seterusnya: " + escapeHTML(sections[cur+1].title) + "</button>"; } 
    else if (submitted && cur === sections.length - 1) { h += "<div class='text-center p-8 bg-emerald-50 rounded-3xl border-2 border-emerald-200 mt-8 shadow-sm'><h3 class='text-2xl font-black text-emerald-600 uppercase mb-2'>Tahniah! Ujian Tamat 🎉</h3><p class='text-sm text-emerald-800 font-medium'>Anda mendapat skor <span class='font-black text-lg'>" + document.getElementById('score-display').innerText + " / " + totalMarks + "</span>.</p></div>"; }
    b.innerHTML = h;
}

window.onload = function() { checkRegistration(); };

</script>
